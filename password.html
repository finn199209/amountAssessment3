<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问验证</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="page page-password">
    <header class="page-header">
      <h1 id="passwordTitle">访问验证</h1>
    </header>

    <section class="password-panel">
      <form id="loginForm" novalidate>
        <div class="field" data-field="loginPassword">
          <label for="loginPassword">输入密码</label>
          <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码">
          <p class="error-message" id="loginPasswordError"></p>
        </div>
        <button class="primary-button" type="submit">进入填写页面</button>
      </form>
    </section>
  </main>

  <script src="./js/password.js"></script>
</body>
</html>
